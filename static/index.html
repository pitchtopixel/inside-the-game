<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Inside the Match</title>
<link rel="stylesheet" href="/static/app.css">
</head>
<body>
<header class="topbar">
  <div class="brand">
    <div class="logo">◆</div>
    <div><b>Inside the Match</b><small>AI match intelligence · synthetic data</small></div>
  </div>
  <div class="scorebox">
    <span class="team" id="homeTeam"><i></i><b>—</b></span>
    <span id="score">0 – 0</span>
    <span class="team away" id="awayTeam"><b>—</b><i></i></span>
    <span id="clock">00:00</span>
  </div>
  <div class="controls">
    <button id="playBtn" title="Play / pause">▶</button>
    <select id="speed" title="Replay speed">
      <option value="1">1×</option><option value="5">5×</option><option value="10">10×</option>
      <option value="20" selected>20×</option><option value="60">60×</option><option value="120">120×</option>
    </select>
    <label class="jump">min <input id="jumpMin" type="number" min="0" max="95" value="45"></label>
    <button id="jumpBtn">Go</button>
    <button id="restartBtn" title="Restart">⟲</button>
    <button id="compareBtn" class="toggle" title="Show two viewers side by side">Compare viewers</button>
  </div>
</header>

<main class="layout">
  <section id="panes" class="panes"></section>
  <aside class="sidebar">
    <div class="card">
      <h3>Live stats</h3>
      <div class="stat-head"><span id="sHome">Home</span><span></span><span id="sAway">Away</span></div>
      <div id="stats"></div>
    </div>
    <div class="card">
      <h3>Momentum <small>threat share, last 5 min</small></h3>
      <div class="bar"><div id="momHome"></div><div id="momAway"></div></div>
      <div class="row"><span id="momLabel">—</span><span id="rhythm" class="chip">balanced</span></div>
    </div>
    <div class="card agents">
      <h3>Agents <small id="provider"></small></h3>
      <div id="agentStats"></div>
      <p class="note">Every AI number is checked against match data. Failures fall back to templates.</p>
    </div>
  </aside>
</main>

<footer class="timeline">
  <div class="track" id="track" title="Click to jump"><div id="progress"></div><div id="dots"></div></div>
  <div class="moments" id="moments"></div>
</footer>

<template id="paneTpl">
  <div class="pane">
    <div class="profilebar">
      <select class="preset"></select>
      <select class="mode"><option value="analyst">Analyst</option><option value="fan">Fan</option></select>
      <select class="language"></select>
      <select class="club"></select>
      <select class="player"></select>
      <select class="metric"></select>
    </div>
    <div class="stage">
      <svg class="pitch" viewBox="-3 -3 111 74" preserveAspectRatio="xMidYMid meet">
        <rect x="-3" y="-3" width="111" height="74" class="grass"/>
        <g class="lines">
          <rect x="0" y="0" width="105" height="68"/><line x1="52.5" y1="0" x2="52.5" y2="68"/>
          <circle cx="52.5" cy="34" r="9.15"/><rect x="0" y="13.84" width="16.5" height="40.32"/>
          <rect x="88.5" y="13.84" width="16.5" height="40.32"/><rect x="0" y="24.84" width="5.5" height="18.32"/>
          <rect x="99.5" y="24.84" width="5.5" height="18.32"/><circle cx="52.5" cy="34" r="0.5" class="spot"/>
        </g>
        <line class="action" x1="0" y1="0" x2="0" y2="0"/>
        <circle class="ball" cx="52.5" cy="34" r="1.3"/>
      </svg>
      <div class="layer full"></div>
      <div class="layer banner"></div>
      <div class="layer side"></div>
      <div class="layer lower"></div>
      <div class="momentum-strip"><div class="mh"></div><div class="ma"></div></div>
    </div>
    <div class="ticker"><span class="ticker-label">Tracker</span><span class="ticker-text">Pick a player or metric to follow</span></div>
  </div>
</template>
<script src="/static/app.js"></script>
</body>
</html>
